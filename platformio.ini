; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Build/Upload padrão inclui o convolutor de gabinete. Use o ambiente sem
; sufixo -cab para o perfil sem IR ou shared-cab para clocks compartilhados.
default_envs = esp32-s3-devkitc-1-n16r8v-cab-profile

[env:esp32-s3-devkitc-1-n16r8v]
platform = espressif32
board = esp32-s3-devkitc-1-n16r8v
framework = espidf
monitor_speed = 115200
upload_speed = 921600

; Desbloqueio dos 16 MB de Flash física e tabela customizada
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

build_flags = 
    -O3
    -D ENABLE_CAB_SIM=0
    -D ENABLE_SERIAL_DEBUG=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -mfix-esp32-psram-cache-issue

; Perfil para a revisão de fiação: ADC e DAC compartilham BCK/LRCK no I2S0.
; A fiação física deve usar os pinos SHARED_BCK_IO/SHARED_WS_IO de AudioConfig.h.
[env:esp32-s3-devkitc-1-n16r8v-shared]
extends = env:esp32-s3-devkitc-1-n16r8v
build_flags =
    ${env:esp32-s3-devkitc-1-n16r8v.build_flags}
    -D I2S_SHARED_CLOCKS=1

; Variante com convolutor de gabinete. Compile a Placa B com o perfil de mesmo
; nome para que o OLED anuncie o item correspondente.
[env:esp32-s3-devkitc-1-n16r8v-cab]
extends = env:esp32-s3-devkitc-1-n16r8v
build_flags =
    -O3
    -D ENABLE_CAB_SIM=1
    -D ENABLE_SERIAL_DEBUG=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -mfix-esp32-psram-cache-issue

[env:esp32-s3-devkitc-1-n16r8v-shared-cab]
extends = env:esp32-s3-devkitc-1-n16r8v
build_flags =
    -O3
    -D ENABLE_CAB_SIM=1
    -D ENABLE_SERIAL_DEBUG=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -mfix-esp32-psram-cache-issue
    -D I2S_SHARED_CLOCKS=1

; Perfis de diagnóstico. Os builds normais mantêm o profiler desligado.
[env:esp32-s3-devkitc-1-n16r8v-profile]
extends = env:esp32-s3-devkitc-1-n16r8v
build_flags = ${env:esp32-s3-devkitc-1-n16r8v.build_flags}
    -D ENABLE_PROFILING=1

[env:esp32-s3-devkitc-1-n16r8v-shared-profile]
extends = env:esp32-s3-devkitc-1-n16r8v-shared
build_flags = ${env:esp32-s3-devkitc-1-n16r8v-shared.build_flags}
    -D ENABLE_PROFILING=1

[env:esp32-s3-devkitc-1-n16r8v-cab-profile]
extends = env:esp32-s3-devkitc-1-n16r8v-cab
build_flags = ${env:esp32-s3-devkitc-1-n16r8v-cab.build_flags}
    -D ENABLE_PROFILING=1

[env:esp32-s3-devkitc-1-n16r8v-shared-cab-profile]
extends = env:esp32-s3-devkitc-1-n16r8v-shared-cab
build_flags = ${env:esp32-s3-devkitc-1-n16r8v-shared-cab.build_flags}
    -D ENABLE_PROFILING=1

; Somente bancada: uma tarefa monitorada deixa de avançar para disparar TWDT.
[env:esp32-s3-devkitc-1-n16r8v-wdt-test]
extends = env:esp32-s3-devkitc-1-n16r8v
build_flags = ${env:esp32-s3-devkitc-1-n16r8v.build_flags}
    -D ENABLE_WDT_TEST_BUILD=1
    -D ENABLE_WDT_TEST_HANG=1
